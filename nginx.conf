# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;

    upstream spring_backend {
        server localhost:8080;
    }

    # HTTP server - 重定向到 HTTPS
    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;
        
        # 重定向所有 HTTP 请求到 HTTPS
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen       443 ssl http2 default_server;
        listen       [::]:443 ssl http2 default_server;
        server_name  _;
        root         /frontend/music/cloud-music/dist;

        try_files $uri $uri/ /index.html;

        # SSL 证书配置
        ssl_certificate      /etc/nginx/ssl/music.zeeeestack.top.pem;
        ssl_certificate_key  /etc/nginx/ssl/music.zeeeestack.top.key;
        
        # SSL 优化配置
        ssl_session_cache          shared:SSL:10m;
        ssl_session_timeout        10m;
        ssl_protocols              TLSv1.2 TLSv1.3;
        ssl_stapling               on;
        ssl_ciphers                HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        # Load configuration files for the default server block.
        include /etc/nginx/default.d/*.conf;

        # 内部location - 用于X-Accel-Redirect发送音频文件
        location /internal/music-files/ {
            internal;
            alias /music/music-files/;
            
            add_header Accept-Ranges bytes;
            add_header Cache-Control "private, must-revalidate";
            add_header Access-Control-Allow-Origin *;
        }
        
        # 内部location - 用于X-Accel-Redirect发送封面图片
        location /internal/music-cover/ {
            internal;
            alias /music/music-cover/;
            
            add_header Cache-Control "public, immutable, max-age=604800";
            add_header Access-Control-Allow-Origin *;
        }
        
        # 封面请求 - 直接返回图片文件
        location ~* ^/api/songs/([^/]+)/cover$ {
            set $song_id $1;
            
            root /music;
            
            try_files /music-cover/$song_id.jpg
                      /music-cover/$song_id.jpeg
                      /music-cover/$song_id.png
                      /music-cover/$song_id.webp
                      @backend_cover;
            
            expires 7d;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin *;
        }
        
        # 播放请求 - 代理到后端验证token
        location ~* ^/api/play/([^/]+)$ {
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            
            proxy_buffering off;
            proxy_request_buffering off;
        }
        
        # 后端封面fallback
        location @backend_cover {
            internal;
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # API请求代理到Spring后端
        location /api/ {
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
        }

        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }
    }
}
