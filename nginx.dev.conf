# 本地开发环境 Nginx 配置

worker_processes auto;
error_log logs/error.log;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    # MIME 类型直接在配置文件中定义
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        image/png                             png;
        image/webp                            webp;
        image/svg+xml                         svg svgz;
        application/javascript                js;
        application/json                      json;
        application/xml                       rss atom;
        audio/mpeg                            mp3;
        audio/wav                             wav;
        audio/flac                            flac;
        audio/ogg                             ogg;
        audio/mp4                             m4a;
        audio/aac                             aac;
        video/mp4                             mp4;
        video/webm                            webm;
        video/ogg                             ogv;
        application/pdf                       pdf;
        application/zip                       zip;
        application/octet-stream              bin exe dll;
        font/woff                             woff;
        font/woff2                            woff2;
        font/ttf                              ttf;
        font/otf                              otf;
    }

    default_type        application/octet-stream;

    upstream spring_backend {
        server localhost:8080;
    }

    upstream frontend_dev {
        server localhost:3000;
    }

    server {
        listen       8081;
        server_name  localhost;

        # 内部 location - 用于 X-Accel-Redirect 发送音频文件
        location /internal/music-files/ {
            internal;
            alias music/music-files/;
            
            add_header Accept-Ranges bytes;
            add_header Cache-Control "private, must-revalidate";
            add_header Access-Control-Allow-Origin *;
        }
        
        # 内部 location - 用于 X-Accel-Redirect 发送封面图片
        location /internal/music-cover/ {
            internal;
            alias music/music-cover/;
            
            add_header Cache-Control "public, immutable, max-age=604800";
            add_header Access-Control-Allow-Origin *;
        }
        
        # 封面请求 - 直接返回图片文件
        location ~* ^/api/songs/([^/]+)/cover$ {
            set $song_id $1;
            
            # 使用 alias 指定封面目录
            alias music/music-cover;
            
            # 尝试多种图片格式
            try_files /$song_id.jpg
                      /$song_id.jpeg
                      /$song_id.png
                      /$song_id.webp
                      @backend_cover;
            
            expires 7d;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin *;
        }
        
        # 播放请求 - 代理到后端验证
        location ~* ^/api/play/([^/]+)$ {
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            
            proxy_buffering off;
            proxy_request_buffering off;
        }
        
        # 后端封面 fallback
        location @backend_cover {
            internal;
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # API 请求代理到 Spring 后端
        location /api/ {
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 前端开发服务器代理
        location / {
            proxy_pass http://frontend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
